<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>{% block title %}Благотворительный местный фонд помощи спортсменам{% endblock %}</title>
    <meta name="title" content="{% block meta_title %}Благотворительный местный фонд помощи спортсменам{% endblock %}">
    <meta name="description" content="{% block meta_description %}Благотворительный фонд поддержки спортсменов в Беларуси. Помогаем спортсменам достигать целей.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}благотворительность, спорт, помощь спортсменам, фонд, Беларусь{% endblock %}">
    <meta name="author" content="Благотворительный местный фонд помощи спортсменам">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{% block canonical %}{{ request.url }}{% endblock %}">
    
    <!-- Open Graph -->
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{{ request.url }}{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Благотворительный местный фонд помощи спортсменам{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Благотворительный фонд поддержки спортсменов в Беларуси.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{{ url_for('static', filename='images/og-image.jpg', _external=True) }}{% endblock %}">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:site_name" content="Благотворительный фонд помощи спортсменам">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ request.url }}">
    <meta property="twitter:title" content="{% block twitter_title %}Благотворительный местный фонд помощи спортсменам{% endblock %}">
    <meta property="twitter:description" content="{% block twitter_description %}Благотворительный фонд поддержки спортсменов в Беларуси{% endblock %}">
    <meta property="twitter:image" content="{% block twitter_image %}{{ url_for('static', filename='images/og-image.jpg', _external=True) }}{% endblock %}">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/categories.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="minimal">
    <header class="brandbar" aria-label="Шапка">
        <div class="brandbar-inner">
            <a class="brandbar-left" href="{{ url_for('index') }}" aria-label="На главную">
                <img class="brandbar-logo-img" src="{{ url_for('static', filename='images/logo.svg') }}" alt="Логотип">
                <img class="brandbar-text" src="{{ url_for('static', filename='images/text.webp') }}" alt="Текст">
            </a>
        </div>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <main class="minimal-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="brand-footer" aria-label="Подвал">
        <img class="brand-footer-img" src="{{ url_for('static', filename='images/text_footer.webp') }}" alt="Футер" />
    </footer>

    {% block structured_data %}{% endblock %}
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
