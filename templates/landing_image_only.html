<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Главная</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(1200px 800px at 50% 0%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 55%),
        linear-gradient(180deg, #0a5aa5 0%, #083a6b 60%, #061f3f 100%);
    }
    .wrap {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }
    /* Мягкий градиент “от картинки в стороны” (виньетка по краям) */
    .wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        linear-gradient(90deg,
          rgba(6, 31, 63, 0.55) 0%,
          rgba(6, 31, 63, 0.18) 12%,
          rgba(6, 31, 63, 0.00) 28%,
          rgba(6, 31, 63, 0.00) 72%,
          rgba(6, 31, 63, 0.18) 88%,
          rgba(6, 31, 63, 0.55) 100%);
    }
    .stage {
      position: relative;
      display: inline-block;
      max-width: 100%;
      max-height: 100%;
      z-index: 1;
    }
    picture, img {
      width: auto;
      height: auto;
      max-width: 100%;
      /* Заполняем экран по высоте, но без кропа */
      max-height: calc(100vh - 32px);
      object-fit: contain;
      display: block;
    }
    @media (min-width: 1100px) { .wrap { padding: 24px; } }
    @media (max-width: 420px) { .wrap { padding: 10px; } }
    /* На мобильных: растягиваем картинку на весь экран */
    @media (max-width: 720px) {
      .wrap { padding: 0; }
      .stage { width: 100vw; height: 100vh; max-width: none; max-height: none; }
      picture, img {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        object-fit: cover;
        object-position: center;
      }
    }
    /* Невидимые кликабельные зоны поверх КАРТИНКИ */
    .hotspot-layer {
      position: absolute;
      inset: 0;
    }

    .hotspot {
      position: absolute;
      display: block;
      text-decoration: none;
      background: transparent;
      border-radius: 14px;
    }

    .hotspot:focus-visible {
      outline: 3px solid rgba(255,255,255,0.85);
      outline-offset: 4px;
    }

    /* Координаты в процентах под финальный макет (3 пункта слева) */
    .hotspot-1 { left: 6.5%; top: 32.5%; width: 26.0%; height: 9.5%; }   /* О фонде */
    .hotspot-2 { left: 6.5%; top: 48.5%; width: 30.0%; height: 10.5%; }  /* Актуальные сборы */
    .hotspot-3 { left: 6.5%; top: 66.5%; width: 34.0%; height: 10.5%; }  /* Направления деятельности */
    .hotspot-4 { left: 56.0%; top: 43.0%; width: 34.0%; height: 24.0%; } /* Местный благотворительный фонд... */
    .placeholder {
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align: center;
      padding: 24px;
      max-width: 720px;
      line-height: 1.4;
    }
    /* Проверка расположения зон: откройте /?debug=1 */
    body.debug .hotspot {
      background: rgba(255, 255, 255, 0.18);
      outline: 2px solid rgba(255, 255, 255, 0.75);
    }
    body.debug .hotspot-1 { background: rgba(0, 255, 255, 0.18); }
    body.debug .hotspot-2 { background: rgba(255, 255, 0, 0.18); }
    body.debug .hotspot-3 { background: rgba(255, 0, 255, 0.18); }
    body.debug .hotspot-4 { background: rgba(0, 255, 0, 0.18); }
  </style>
</head>
<body class="{% if request.args.get('debug') %}debug{% endif %}">
  <div class="wrap">
    <div class="stage">
      {% if homepage and homepage.hero_image_url %}
        <picture>
          {% if homepage.hero_image_url_mobile %}
            <source media="(max-width: 720px)" srcset="{{ homepage.hero_image_url_mobile }}">
          {% endif %}
          <img src="{{ homepage.hero_image_url }}" alt="Заглавная картинка" />
        </picture>

        <div class="hotspot-layer">
          <a class="hotspot hotspot-1" href="{{ url_for('about') }}" aria-label="О фонде"></a>
          <a class="hotspot hotspot-2" href="{{ url_for('fundraisers') }}" aria-label="Актуальные сборы"></a>
          <a class="hotspot hotspot-3" href="{{ url_for('directions') }}" aria-label="Направления деятельности"></a>
          <a class="hotspot hotspot-4" href="{{ url_for('fund_about') }}" aria-label="Местный благотворительный фонд помощи спортсменам"></a>
        </div>
      {% else %}
        <div class="placeholder">
          Загрузите заглавную картинку в админке: «Главная» → «Баннер».
        </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
