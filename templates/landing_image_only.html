<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Главная</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(1200px 800px at 50% 0%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 55%),
        linear-gradient(180deg, #0a5aa5 0%, #083a6b 60%, #061f3f 100%);
    }
    .wrap {
      min-height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px; /* компактнее отступы */
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }
    .brandbar {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0;
      width: min(1320px, 100%);
      margin: 10px auto 12px;
    }
    .brandbar img {
      display: block;
      height: 34px;
      width: auto;
      max-width: 48%;
      object-fit: contain;
    }
    .brandbar .brand-logo { height: 44px; }
    @media (max-width: 420px) {
      .brandbar { top: 10px; left: 10px; right: 10px; }
      .brandbar img { height: 30px; }
      .brandbar .brand-logo { height: 40px; }
    }
    /* Мягкий градиент “от картинки в стороны” (виньетка по краям) */
    .wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        linear-gradient(90deg,
          rgba(6, 31, 63, 0.55) 0%,
          rgba(6, 31, 63, 0.18) 12%,
          rgba(6, 31, 63, 0.00) 28%,
          rgba(6, 31, 63, 0.00) 72%,
          rgba(6, 31, 63, 0.18) 88%,
          rgba(6, 31, 63, 0.55) 100%);
    }
    .layout {
      width: min(1320px, 100%);
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      z-index: 1;
      margin: 0 auto;
    }
    .menu {
      align-self: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .menu a {
      display: block;
      padding: 14px 16px;
      border-radius: 16px;
      text-decoration: none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 0.2px;
      color: rgba(255,255,255,0.94);
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 140ms ease, background 140ms ease;
    }
    .menu a:hover { transform: translateY(-1px); background: rgba(255,255,255,0.14); }
    .menu a:focus-visible { outline: 3px solid rgba(255,255,255,0.85); outline-offset: 4px; }

    .hero {
      align-self: center;
      border-radius: 0;
      overflow: visible;
      border: none;
      background: transparent;
    }
    .hero picture, .hero img {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100vh - 120px);
      object-fit: contain;
    }
    @media (min-width: 1100px) { .wrap { padding: 10px; } }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; gap: 14px; }
      .menu { align-self: stretch; }
      .hero picture, .hero img { max-height: none; }
    }
    @media (max-width: 420px) {
      .wrap { padding: 8px; }
      .menu a { padding: 14px 16px; border-radius: 16px; }
    }
    /* Мобильная версия: тот же макет, но компактнее */
    @media (max-width: 720px) {
      .wrap { padding-left: 10px; padding-right: 10px; }
      .brandbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .brandbar img { max-width: min(520px, 100%); }
      .layout { gap: 12px; }
      .menu a { padding: 16px 16px; }
    }
    .placeholder {
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align: center;
      padding: 24px;
      max-width: 720px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="brandbar" aria-label="Шапка">
      <img class="brand-logo" src="{{ url_for('static', filename='images/logo.svg') }}" alt="Логотип" />
      <img src="{{ url_for('static', filename='images/text.webp') }}" alt="Текст" />
    </header>

    <div class="layout">
      <nav class="menu" aria-label="Меню">
        <a href="{{ url_for('about') }}">О фонде</a>
        <a href="{{ url_for('fundraisers') }}">Актуальные сборы</a>
        <a href="{{ url_for('directions') }}">Направления деятельности</a>
        <a href="{{ url_for('fund_about') }}">Местный благотворительный фонд</a>
        <a href="{{ url_for('reports') }}">Отчетность</a>
      </nav>

      <div class="hero">
        <picture>
          <img src="{{ url_for('static', filename='images/mainpic.webp') }}" alt="Главная картинка" />
        </picture>
      </div>
    </div>
  </div>
</body>
</html>
