<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Главная</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(1200px 800px at 50% 0%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 55%),
        linear-gradient(180deg, #0a5aa5 0%, #083a6b 60%, #061f3f 100%);
    }
    .wrap {
      min-height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px; /* компактнее отступы */
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }
    .brand-footer {
      width: min(1320px, 100%);
      margin: 14px auto 6px;
      display: flex;
      justify-content: flex-start;
      z-index: 1;
    }
    .brand-footer img {
      height: 34px;
      width: auto;
      max-width: min(560px, 92vw);
      object-fit: contain;
      display: block;
    }
    @media (max-width: 420px) {
      .brand-footer img { height: 28px; }
    }
    .legal-footer {
      width: min(1320px, 100%);
      margin: 2px auto 8px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 16px;
      z-index: 1;
    }
    .legal-footer a {
      color: rgba(255,255,255,0.86);
      text-decoration: none;
      font-size: 0.92rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .legal-footer a:hover { color: #fff; text-decoration: underline; }
    .legal-footer-brand-img {
      height: clamp(28px, 4.2vw, 52px);
      width: auto;
      object-fit: contain;
      display: block;
      margin-left: 8%;
      margin-right: 14px;
    }
    @media (max-width: 720px) {
      .legal-footer { margin-top: 14px; }
      .legal-footer-brand-img { margin-left: 0; margin-right: 12px; }
    }
    .legal-footer-links {
      margin-left: auto;
      align-items: center;
      display: flex;
      justify-content: center;
      gap: 10px 16px;
      flex-wrap: wrap;
    }
    .donate-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px;
    }
    .donate-modal-overlay.is-open { display: flex; }
    .donate-modal-content {
      width: min(70vw, 400px); height: 80vh; max-height: calc(100vh - 32px);
      background: #ecdede; border-radius: 12px; overflow: hidden; position: relative;
    }
    .donate-modal-content img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .donate-modal-close {
      position: absolute; top: 6px; right: 8px; width: 28px; height: 28px; border: 0; border-radius: 50%;
      background: rgba(0,0,0,0.45); color: #fff; cursor: pointer; font-size: 18px; line-height: 1;
    }
    .brandbar {
      position: relative;
      z-index: 2;
      width: min(1320px, 100%);
      margin: 10px auto 12px;
    }
    .brandbar-left {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .brandbar-left img {
      display: block;
      width: auto;
      object-fit: contain;
    }
    .brandbar-left .brand-logo { height: 65px; }
    .brandbar-left .brand-text { height: 54px; max-width: min(560px, 70vw); }
    @media (max-width: 420px) {
      .brandbar { top: 10px; left: 10px; right: 10px; }
      .brandbar-left .brand-logo { height: 46px; }
      .brandbar-left .brand-text { height: 32px; max-width: 78vw; }
    }
    /* Мягкий градиент “от картинки в стороны” (виньетка по краям) */
    .wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        linear-gradient(90deg,
          rgba(6, 31, 63, 0.55) 0%,
          rgba(6, 31, 63, 0.18) 12%,
          rgba(6, 31, 63, 0.00) 28%,
          rgba(6, 31, 63, 0.00) 72%,
          rgba(6, 31, 63, 0.18) 88%,
          rgba(6, 31, 63, 0.55) 100%);
    }
    .layout {
      width: min(1320px, 100%);
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      z-index: 1;
      margin: 0 auto;
    }
    .menu {
      align-self: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .menu a {
      display: block;
      padding: 14px 16px;
      border-radius: 16px;
      text-decoration: none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 0.2px;
      color: rgba(255,255,255,0.94);
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 140ms ease, background 140ms ease;
    }
    .menu a:hover { transform: translateY(-1px); background: rgba(255,255,255,0.14); }
    .menu a:focus-visible { outline: 3px solid rgba(255,255,255,0.85); outline-offset: 4px; }

    .hero {
      align-self: center;
      border-radius: 0;
      overflow: visible;
      border: none;
      background: transparent;
    }
    .hero-link {
      display: block;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .hero-link:focus-visible {
      outline: 3px solid rgba(255,255,255,0.85);
      outline-offset: 4px;
    }
    .hero picture, .hero img {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100vh - 120px);
      object-fit: contain;
    }
    @media (min-width: 1100px) { .wrap { padding: 10px; } }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; gap: 14px; }
      .menu { align-self: stretch; }
      .hero picture, .hero img { max-height: none; }
      /* На телефоне/планшете: сначала "Местный Благотворительный фонд" (hero), затем меню */
      .hero { order: 1; }
      .menu { order: 2; }
    }
    @media (max-width: 420px) {
      .wrap { padding: 8px; }
      .menu a { padding: 14px 16px; border-radius: 16px; }
    }
    /* Мобильная версия: тот же макет, но компактнее */
    @media (max-width: 720px) {
      .wrap { padding-left: 10px; padding-right: 10px; }
      .layout { gap: 12px; }
      .menu a { padding: 16px 16px; }
    }
    .placeholder {
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align: center;
      padding: 24px;
      max-width: 720px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="brandbar" aria-label="Шапка">
      <a class="brandbar-left" href="{{ url_for('index') }}" aria-label="На главную">
        <img class="brand-logo" src="{{ url_for('static', filename='images/logo.svg') }}" alt="Логотип" />
        <img class="brand-text" src="{{ url_for('static', filename='images/text.webp') }}" alt="Текст" />
      </a>
    </header>

    <div class="layout">
      <nav class="menu" aria-label="Меню">
        <a href="{{ url_for('future_champion') }}">Будущий чемпион</a>
        <a href="{{ url_for('loyalty_to_sport_page') }}">Верность спорту</a>
        <a href="{{ url_for('veterans_and_coaches_page') }}">Ветераны спорта и тренеры</a>
        <a href="{{ url_for('sport_infrastructure_page') }}">Спортивная инфраструктура</a>
      </nav>

      <div class="hero">
        <a class="hero-link" href="{{ url_for('fund_about') }}" aria-label="О фонде">
          <picture>
            <img src="{{ url_for('static', filename='images/mainpic.webp') }}" alt="О фонде" />
          </picture>
        </a>
      </div>
    </div>

    <div class="legal-footer" aria-label="Юридическая информация">
      <img class="legal-footer-brand-img" src="{{ url_for('static', filename='images/text_footer.webp') }}" alt="Футер" />
      <div class="legal-footer-links">
        <a href="{{ url_for('legal_page', doc_type='offer') }}">Публичная оферта</a>
        <a href="{{ url_for('legal_page', doc_type='policy') }}">Политика защиты данных</a>
        <a href="{{ url_for('donate') }}">Поддержать</a>
      </div>
    </div>
  </div>
  <div id="donateModal" class="donate-modal-overlay" aria-hidden="true">
    <div class="donate-modal-content" role="dialog" aria-modal="true" aria-label="Оплата">
      <button class="donate-modal-close" type="button" aria-label="Закрыть">×</button>
      <img src="{{ url_for('static', filename='images/pay.webp') }}" alt="Информация для оплаты">
    </div>
  </div>
  <script>
    (function () {
      const modal = document.getElementById('donateModal');
      if (!modal) return;
      const closeBtn = modal.querySelector('.donate-modal-close');
      function openModal() { modal.classList.add('is-open'); document.body.style.overflow = 'hidden'; }
      function closeModal() { modal.classList.remove('is-open'); document.body.style.overflow = ''; }
      document.addEventListener('click', function (e) {
        const link = e.target.closest('a[href]');
        if (!link) return;
        const href = link.getAttribute('href') || '';
        if (href === "{{ url_for('donate') }}" || href.endsWith('/donate')) { e.preventDefault(); openModal(); }
      });
      if (closeBtn) closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
    })();
  </script>
</body>
</html>
