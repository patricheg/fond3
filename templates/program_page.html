{% extends "base_minimal.html" %}
{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<section class="fc-page">
  <div class="fc-card">
    <h1 class="fc-title">{{ page.title }}</h1>

    <div class="fc-stage">
      <div class="fc-text">
        {{ page.text|replace('\n', '<br>')|safe }}
      </div>

      <div class="fc-photo" aria-hidden="true">
        <img src="{{ url_for('static', filename=page.image) }}" alt="">
      </div>
    </div>

    <div class="fc-actions">
      <a class="fc-btn" href="{{ url_for('donate') }}">Поддержать</a>
    </div>
  </div>
</section>

<style>
  .fc-page { padding: 18px 12px 28px; }
  .fc-card {
    max-width: 1120px;
    margin: 0 auto;
    background: #e6e6e6;
    box-shadow: 0 18px 60px rgba(0,0,0,0.14);
    padding: 20px 14px 26px;
  }
  .fc-title {
    margin: 4px 0 12px;
    text-align: center;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-weight: 600;
    font-size: clamp(30px, 4.3vw, 46px);
    line-height: 1.08;
    color: rgba(0,0,0,0.92);
  }
  .fc-stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    gap: 0;
    align-items: stretch;
  }
  .fc-text {
    background: #8bc8e6;
    padding: 20px 18px;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-weight: 500;
    font-size: clamp(18px, 1.9vw, 42px);
    line-height: 1.45;
    color: rgba(0,0,0,0.96);
  }
  .fc-photo { background: #8bc8e6; }
  .fc-photo img {
    width: 100%;
    height: 100%;
    min-height: 430px;
    display: block;
    object-fit: cover;
    object-position: center;
    border-radius: 0;
  }
  .fc-actions { display: flex; justify-content: center; padding-top: 16px; }
  .fc-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 280px;
    padding: 14px 22px;
    background: #5b84b4;
    border: 1px solid #5b84b4;
    color: #fff;
    text-decoration: none;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 2.1vw, 36px);
    line-height: 1.1;
  }
  @media (max-width: 980px) {
    .fc-stage { grid-template-columns: 1fr; }
    .fc-photo img { min-height: 280px; height: auto; }
    .fc-btn { min-width: 240px; }
  }
  @media (max-width: 420px) { .fc-card { padding: 14px 12px 18px; } }
</style>
{% endblock %}
