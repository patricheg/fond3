<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Направления деятельности</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(1200px 800px at 50% 0%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 55%),
        linear-gradient(180deg, #0a5aa5 0%, #083a6b 60%, #061f3f 100%);
    }
    .wrap {
      min-height: 100%;
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
      padding-top: 64px; /* место под кнопку "Домой" */
      box-sizing: border-box;
      position: relative;
      overflow: visible;
    }
    .footer {
      margin-top: 16px;
      width: min(1100px, 100%);
      display: flex;
      justify-content: center;
    }
    .footer img {
      height: 34px;
      width: auto;
      max-width: min(560px, 92vw);
      object-fit: contain;
      display: block;
    }
    .legal-footer {
      margin-top: 4px;
      width: min(1100px, 100%);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 16px;
    }
    .legal-footer a {
      color: rgba(255,255,255,0.86);
      text-decoration: none;
      font-size: 0.92rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .legal-footer a:hover { color: #fff; text-decoration: underline; }
    .donate-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px;
    }
    .donate-modal-overlay.is-open { display: flex; }
    .donate-modal-content {
      width: min(70vw, 400px); height: 80vh; max-height: calc(100vh - 32px);
      background: #ecdede; border-radius: 12px; overflow: hidden; position: relative;
    }
    .donate-modal-content img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .donate-modal-close {
      position: absolute; top: 6px; right: 8px; width: 28px; height: 28px; border: 0; border-radius: 50%;
      background: rgba(0,0,0,0.45); color: #fff; cursor: pointer; font-size: 18px; line-height: 1;
    }
    .wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        linear-gradient(90deg,
          rgba(6, 31, 63, 0.55) 0%,
          rgba(6, 31, 63, 0.18) 12%,
          rgba(6, 31, 63, 0.00) 28%,
          rgba(6, 31, 63, 0.00) 72%,
          rgba(6, 31, 63, 0.18) 88%,
          rgba(6, 31, 63, 0.55) 100%);
    }
    @media (min-width: 1100px) { .wrap { padding: 24px; } }
    @media (max-width: 420px) { .wrap { padding: 10px; } }
    /* На мобильных: вписываем картинку в экран (без обрезки) */
    @media (max-width: 720px) {
      .wrap { padding: 0; padding-top: 0; }
      .stage { width: 100vw; }
      picture, img {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        object-position: center;
        border-radius: 0;
      }
      .wrap::before { opacity: 0.85; }
    }

    .topbar {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 3;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 14px;
      text-decoration: none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-weight: 800;
      color: rgba(255,255,255,0.92);
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .home-btn:focus-visible {
      outline: 3px solid rgba(255,255,255,0.85);
      outline-offset: 4px;
    }

    .brandbar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 4;
      padding: 0;
    }
    .brandbar-left {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .brandbar-left img {
      display: block;
      width: auto;
      object-fit: contain;
    }
    .brandbar-left .brand-logo { height: 52px; }
    .brandbar-left .brand-text { height: 38px; max-width: min(560px, 70vw); }
    @media (max-width: 420px) {
      .brandbar { top: 10px; left: 10px; right: 10px; }
      .brandbar-left .brand-logo { height: 46px; }
      .brandbar-left .brand-text { height: 32px; max-width: 78vw; }
    }

    .stage {
      position: relative;
      width: min(1100px, 100%);
      z-index: 1;
    }
    picture, img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 14px;
    }
    .placeholder {
      color: rgba(255,255,255,0.92);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align: center;
      padding: 24px;
      max-width: 720px;
      line-height: 1.4;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="brandbar" aria-label="Шапка">
      <a class="brandbar-left" href="{{ url_for('index') }}" aria-label="На главную">
        <img class="brand-logo" src="{{ url_for('static', filename='images/logo.svg') }}" alt="Логотип" />
        <img class="brand-text" src="{{ url_for('static', filename='images/text.webp') }}" alt="Текст" />
      </a>
    </header>

    <div class="stage">
      {% if homepage and homepage.directions_image_url %}
        <picture>
          {% if homepage.directions_image_url_mobile %}
            <source media="(max-width: 720px)" srcset="{{ homepage.directions_image_url_mobile }}">
          {% endif %}
          <img src="{{ homepage.directions_image_url }}" alt="Направления деятельности" />
        </picture>
      {% else %}
        <div class="placeholder">
          Загрузите картинку для страницы «Направления деятельности» в админке: «Главная» → «Картинка направлений».
        </div>
      {% endif %}
    </div>

    <footer class="footer" aria-label="Подвал">
      <img src="{{ url_for('static', filename='images/text_footer.webp') }}" alt="Футер" />
    </footer>
    <div class="legal-footer" aria-label="Юридическая информация">
      <a href="{{ url_for('legal_file', doc_type='offer') }}">Публичная оферта</a>
      <a href="{{ url_for('legal_file', doc_type='policy') }}">Политика защиты данных</a>
      <a href="{{ url_for('donate') }}">Как платить</a>
    </div>
  </div>
  <div id="donateModal" class="donate-modal-overlay" aria-hidden="true">
    <div class="donate-modal-content" role="dialog" aria-modal="true" aria-label="Оплата">
      <button class="donate-modal-close" type="button" aria-label="Закрыть">×</button>
      <img src="{{ url_for('static', filename='images/pay.webp') }}" alt="Информация для оплаты">
    </div>
  </div>
  <script>
    (function () {
      const modal = document.getElementById('donateModal');
      if (!modal) return;
      const closeBtn = modal.querySelector('.donate-modal-close');
      function openModal() { modal.classList.add('is-open'); document.body.style.overflow = 'hidden'; }
      function closeModal() { modal.classList.remove('is-open'); document.body.style.overflow = ''; }
      document.addEventListener('click', function (e) {
        const link = e.target.closest('a[href]');
        if (!link) return;
        const href = link.getAttribute('href') || '';
        if (href === "{{ url_for('donate') }}" || href.endsWith('/donate')) { e.preventDefault(); openModal(); }
      });
      if (closeBtn) closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
    })();
  </script>
</body>
</html>
