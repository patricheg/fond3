<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Направления деятельности</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(1200px 800px at 50% 0%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 55%),
        linear-gradient(180deg, #0a5aa5 0%, #083a6b 60%, #061f3f 100%);
    }
    .wrap {
      min-height: 100%;
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
      padding-top: 64px; /* место под кнопку "Домой" */
      box-sizing: border-box;
      position: relative;
      overflow: visible;
    }
    .wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        linear-gradient(90deg,
          rgba(6, 31, 63, 0.55) 0%,
          rgba(6, 31, 63, 0.18) 12%,
          rgba(6, 31, 63, 0.00) 28%,
          rgba(6, 31, 63, 0.00) 72%,
          rgba(6, 31, 63, 0.18) 88%,
          rgba(6, 31, 63, 0.55) 100%);
    }
    @media (min-width: 1100px) { .wrap { padding: 24px; } }
    @media (max-width: 420px) { .wrap { padding: 10px; } }
    /* На мобильных: вписываем картинку в экран (без обрезки) */
    @media (max-width: 720px) {
      .wrap { padding: 0; padding-top: 0; }
      .stage { width: 100vw; }
      picture, img {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        object-position: center;
        border-radius: 0;
      }
      .wrap::before { opacity: 0.85; }
    }

    .topbar {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 3;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 14px;
      text-decoration: none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-weight: 800;
      color: rgba(255,255,255,0.92);
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .home-btn:focus-visible {
      outline: 3px solid rgba(255,255,255,0.85);
      outline-offset: 4px;
    }

    .brandbar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 12px;
      padding: 0;
    }
    .brandbar img {
      display: block;
      height: 34px;
      width: auto;
      max-width: min(520px, 100%);
      object-fit: contain;
    }
    .brandbar .brand-logo { height: 44px; }
    @media (max-width: 420px) {
      .brandbar { top: 10px; left: 10px; right: 10px; }
      .brandbar img { height: 30px; }
      .brandbar .brand-logo { height: 40px; }
    }

    .stage {
      position: relative;
      width: min(1100px, 100%);
      z-index: 1;
    }
    picture, img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 14px;
    }
    .placeholder {
      color: rgba(255,255,255,0.92);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align: center;
      padding: 24px;
      max-width: 720px;
      line-height: 1.4;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="brandbar" aria-label="Шапка">
      <a class="home-btn" href="{{ url_for('index') }}" aria-label="На главную">← Домой</a>
      <img class="brand-logo" src="{{ url_for('static', filename='images/logo.svg') }}" alt="Логотип" />
      <img src="{{ url_for('static', filename='images/text.webp') }}" alt="Текст" />
    </header>

    <div class="stage">
      {% if homepage and homepage.directions_image_url %}
        <picture>
          {% if homepage.directions_image_url_mobile %}
            <source media="(max-width: 720px)" srcset="{{ homepage.directions_image_url_mobile }}">
          {% endif %}
          <img src="{{ homepage.directions_image_url }}" alt="Направления деятельности" />
        </picture>
      {% else %}
        <div class="placeholder">
          Загрузите картинку для страницы «Направления деятельности» в админке: «Главная» → «Картинка направлений».
        </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
